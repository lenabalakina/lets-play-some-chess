<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" fill="#0a0f1a" rx="8"/>
  <!-- 3D Board perspective -->
  <g transform="translate(60, 10)">
    <!-- Board in perspective -->
    <polygon points="100,20 200,20 240,80 60,80" fill="#1a2235" stroke="#00e5ff" stroke-width="0.5" opacity="0.9"/>
    <!-- Grid lines horizontal -->
    <line x1="70" y1="35" x2="230" y2="35" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="75" y1="50" x2="235" y2="50" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="80" y1="65" x2="238" y2="65" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <!-- Grid lines vertical -->
    <line x1="115" y1="20" x2="75" y2="80" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="130" y1="20" x2="90" y2="80" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="160" y1="20" x2="120" y2="80" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="180" y1="20" x2="155" y2="80" stroke="#00e5ff" stroke-width="0.3" opacity="0.4"/>
    <!-- Pieces on board -->
    <text x="90" y="78" font-size="16" fill="#00e5ff">♟</text>
    <text x="125" y="72" font-size="16" fill="white">♙</text>
    <text x="155" y="65" font-size="14" fill="#00e5ff">♛</text>
    <text x="110" y="55" font-size="14" fill="white">♔</text>
    <!-- Board side -->
    <polygon points="60,80 240,80 240,90 60,90" fill="#0d1520" stroke="#00e5ff" stroke-width="0.5" opacity="0.6"/>
  </g>
  <!-- Theme swatches -->
  <g transform="translate(20, 110)">
    <text x="0" y="12" font-size="8" fill="#475569">THEMES</text>
    <!-- Neon -->
    <rect x="0" y="18" width="55" height="30" fill="#0a0f1a" rx="4" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="27" y="38" font-size="8" text-anchor="middle" fill="#00e5ff">NEON</text>
    <!-- Void -->
    <rect x="63" y="18" width="55" height="30" fill="#050508" rx="4" stroke="#6366f1" stroke-width="1.5"/>
    <text x="90" y="38" font-size="8" text-anchor="middle" fill="#6366f1">VOID</text>
    <!-- Ember -->
    <rect x="126" y="18" width="55" height="30" fill="#1a0a00" rx="4" stroke="#f97316" stroke-width="1.5"/>
    <text x="153" y="38" font-size="8" text-anchor="middle" fill="#f97316">EMBER</text>
    <!-- Arctic -->
    <rect x="189" y="18" width="55" height="30" fill="#0a1520" rx="4" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="216" y="38" font-size="8" text-anchor="middle" fill="#e2e8f0">ARCTIC</text>
  </g>
  <text x="160" y="168" font-size="10" text-anchor="middle" fill="#334155">Flip to 3D with one toggle</text>
</svg>
