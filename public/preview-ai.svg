<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" fill="#0a0f1a" rx="8"/>
  <!-- Chess board -->
  <g transform="translate(30, 20)">
    <rect width="120" height="120" fill="#1a2235" rx="4"/>
    <rect x="0" y="0" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="60" y="0" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="90" y="0" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="30" y="30" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="90" y="30" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="0" y="60" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="60" y="60" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="30" y="90" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <rect x="90" y="90" width="30" height="30" fill="#00e5ff" opacity="0.15"/>
    <!-- Pieces -->
    <text x="15" y="28" font-size="22" text-anchor="middle" fill="white">♔</text>
    <text x="75" y="28" font-size="22" text-anchor="middle" fill="#00e5ff">♛</text>
    <text x="45" y="58" font-size="22" text-anchor="middle" fill="white">♗</text>
    <text x="105" y="88" font-size="22" text-anchor="middle" fill="#00e5ff">♜</text>
    <text x="15" y="118" font-size="22" text-anchor="middle" fill="white">♙</text>
    <text x="75" y="118" font-size="22" text-anchor="middle" fill="#00e5ff">♟</text>
    <!-- Highlight move -->
    <rect x="60" y="60" width="30" height="30" fill="#00e5ff" opacity="0.25" rx="2"/>
  </g>
  <!-- AI Brain -->
  <g transform="translate(185, 25)">
    <rect width="105" height="130" fill="#111827" rx="10" stroke="#00e5ff" stroke-width="1" opacity="0.8"/>
    <text x="52" y="30" font-size="11" font-weight="bold" text-anchor="middle" fill="#00e5ff">AI ENGINE</text>
    <!-- Difficulty bars -->
    <text x="15" y="55" font-size="8" fill="#475569">EASY</text>
    <rect x="45" y="46" width="50" height="8" fill="#1a2235" rx="4"/>
    <rect x="45" y="46" width="20" height="8" fill="#00e5ff" opacity="0.5" rx="4"/>
    <text x="15" y="75" font-size="8" fill="#475569">MED</text>
    <rect x="45" y="66" width="50" height="8" fill="#1a2235" rx="4"/>
    <rect x="45" y="66" width="35" height="8" fill="#00e5ff" opacity="0.7" rx="4"/>
    <text x="15" y="95" font-size="8" fill="#475569">HARD</text>
    <rect x="45" y="86" width="50" height="8" fill="#1a2235" rx="4"/>
    <rect x="45" y="86" width="50" height="8" fill="#00e5ff" opacity="0.9" rx="4"/>
    <!-- Thinking indicator -->
    <text x="52" y="118" font-size="8" text-anchor="middle" fill="#00e5ff" opacity="0.7">● thinking...</text>
  </g>
  <text x="160" y="165" font-size="10" text-anchor="middle" fill="#334155">Powered by Stockfish engine</text>
</svg>
